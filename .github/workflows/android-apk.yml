name: Hub-Mind Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a production-signed Android release when signing secrets are configured
        required: false
        default: true
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'src/firebaseConfig.ts'
      - 'tests/android/**'
      - 'src/services/crossDeviceService.ts'
      - 'src/components/DesktopUpdatesModal.tsx'
      - '.github/workflows/android-apk.yml'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'src/firebaseConfig.ts'
      - 'tests/android/**'
      - 'src/services/crossDeviceService.ts'
      - 'src/components/DesktopUpdatesModal.tsx'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    outputs:
      release_signing_available: ${{ steps.signing.outputs.available }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 35 platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: false

      - name: Decode optional Android release keystore
        id: signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          HUBMIND_RELEASE_STORE_PASSWORD: ${{ secrets.HUBMIND_RELEASE_STORE_PASSWORD }}
          HUBMIND_RELEASE_KEY_ALIAS: ${{ secrets.HUBMIND_RELEASE_KEY_ALIAS }}
          HUBMIND_RELEASE_KEY_PASSWORD: ${{ secrets.HUBMIND_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_RELEASE_KEYSTORE_BASE64" && -n "$HUBMIND_RELEASE_STORE_PASSWORD" && -n "$HUBMIND_RELEASE_KEY_ALIAS" && -n "$HUBMIND_RELEASE_KEY_PASSWORD" ]]; then
            echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/hubmind-release.jks"
            test -s "${RUNNER_TEMP}/hubmind-release.jks"
            echo "HUBMIND_RELEASE_STORE_FILE=${RUNNER_TEMP}/hubmind-release.jks" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; this run will produce a debug test APK only."
          fi

      - name: Run Android JVM tests and build debug test APK
        working-directory: android
        run: |
          set -euo pipefail
          bash ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk ../release/Hub-Mind-Android-v2.4.0-debug.apk

      - name: Build signed release APK when signing secrets are available
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        env:
          HUBMIND_RELEASE_STORE_PASSWORD: ${{ secrets.HUBMIND_RELEASE_STORE_PASSWORD }}
          HUBMIND_RELEASE_KEY_ALIAS: ${{ secrets.HUBMIND_RELEASE_KEY_ALIAS }}
          HUBMIND_RELEASE_KEY_PASSWORD: ${{ secrets.HUBMIND_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew assembleRelease --no-daemon --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "../release/Hub-Mind-Android-v${VERSION_NAME}.apk"

      - name: Verify APK metadata and print signing certificate fingerprints
        env:
          EXPECTED_APPLICATION_ID: com.aistudio.hubmind.wzyqkp
          EXPECTED_VERSION_CODE: '240'
          EXPECTED_VERSION_NAME: '2.4.0'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          for APK in release/*.apk; do
            echo "Verifying $APK"
            "$APKSIGNER" verify --verbose "$APK"
            BADGING="$("$AAPT" dump badging "$APK")"
            echo "$BADGING" | grep -F "name='$EXPECTED_APPLICATION_ID'"
            echo "$BADGING" | grep -F "versionCode='$EXPECTED_VERSION_CODE'"
            echo "$BADGING" | grep -F "versionName='$EXPECTED_VERSION_NAME'"
            "$APKSIGNER" verify --print-certs "$APK"
          done

      - name: Upload Android APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hub-mind-android-v2.4.0-build
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

  publish-android-debug-prerelease:
    name: Publish Android debug APK as a testing prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-android-apk.outputs.release_signing_available != 'true'
    needs: build-android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified Android build artifact
        uses: actions/download-artifact@v4
        with:
          name: hub-mind-android-v2.4.0-build
          path: release

      - name: Publish the debug APK as a clearly labelled prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v2.4.0-debug-${{ github.run_number }}
          name: Hub-Mind Android v2.4.0 — Debug Test Build #${{ github.run_number }}
          body: |
            **TEST BUILD ONLY — NOT AN OFFICIAL PRODUCTION RELEASE.**

            This APK is built and verified by CI using Android's debug signing configuration.
            It is published so the Hub-Mind website can provide a direct test download.

            - It is not a production-signed APK.
            - It cannot update an installation signed with a different certificate.
            - It is not offered through the in-app automatic updater.
            - Use only for owner-controlled device testing.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: release/Hub-Mind-Android-v2.4.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-android-release:
    name: Publish production-signed Android APK
    if: >
      needs.build-android-apk.outputs.release_signing_available == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
      )
    needs: build-android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download verified Android build artifacts
        uses: actions/download-artifact@v4
        with:
          name: hub-mind-android-v2.4.0-build
          path: release

      - name: Read release metadata and calculate APK checksum
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' android/app/build.gradle.kts | head -n 1)"
          APK="release/Hub-Mind-Android-v$VERSION_NAME.apk"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          test -s "$APK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          TAG_NAME="android-v$VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_file=$APK" >> "$GITHUB_OUTPUT"
          echo "Verified release APK SHA-256: $SHA256"

      - name: Publish official signed Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: Hub-Mind Android v${{ steps.release.outputs.version_name }}
          body: |
            **OFFICIAL HUB-MIND ANDROID RELEASE**

            This APK is signed with the dedicated Hub-Mind production release keystore.
            Download the APK directly from the Hub-Mind website's Android downloads section.

            - Application ID: com.aistudio.hubmind.wzyqkp
            - Version: ${{ steps.release.outputs.version_name }}
            - Version code: ${{ steps.release.outputs.version_code }}
            - SHA-256: ${{ steps.release.outputs.sha256 }}

            Keep the original release keystore and passwords backed up securely. Future updates must use the same signing identity.
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          files: ${{ steps.release.outputs.apk_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update website and in-app update manifest
        uses: actions/github-script@v7
        env:
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          APK_SHA256: ${{ steps.release.outputs.sha256 }}
          APK_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag_name }}/Hub-Mind-Android-v${{ steps.release.outputs.version_name }}.apk
        with:
          script: |
            const manifest = {
              releaseStatus: 'PUBLISHED',
              versionCode: Number(process.env.VERSION_CODE),
              versionName: process.env.VERSION_NAME,
              applicationId: 'com.aistudio.hubmind.wzyqkp',
              apkUrl: process.env.APK_URL,
              sha256: process.env.APK_SHA256,
              releaseNotes: 'Hub-Mind Android v' + process.env.VERSION_NAME + ' is an official production-signed release.',
              minSupportedVersionCode: Number(process.env.VERSION_CODE),
            };
            const path = 'public/api/app-version.json';
            const { data: current } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: 'main',
            });
            if (Array.isArray(current) || !current.sha) {
              throw new Error('The existing Android update manifest could not be read as a file.');
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'chore(android): publish signed v' + process.env.VERSION_NAME + ' update manifest',
              content: Buffer.from(JSON.stringify(manifest, null, 2) + '\n').toString('base64'),
              sha: current.sha,
              branch: 'main',
            });
            core.info('Published update manifest for Android v' + process.env.VERSION_NAME + '.');
