name: Hub-Mind Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode optional Android release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          HUBMIND_RELEASE_STORE_PASSWORD: ${{ secrets.HUBMIND_RELEASE_STORE_PASSWORD }}
          HUBMIND_RELEASE_KEY_ALIAS: ${{ secrets.HUBMIND_RELEASE_KEY_ALIAS }}
          HUBMIND_RELEASE_KEY_PASSWORD: ${{ secrets.HUBMIND_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_RELEASE_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/hubmind-release.jks"
            echo "HUBMIND_RELEASE_STORE_FILE=${RUNNER_TEMP}/hubmind-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Run Android JVM unit tests and build APKs
        working-directory: android
        env:
          HUBMIND_RELEASE_STORE_PASSWORD: ${{ secrets.HUBMIND_RELEASE_STORE_PASSWORD }}
          HUBMIND_RELEASE_KEY_ALIAS: ${{ secrets.HUBMIND_RELEASE_KEY_ALIAS }}
          HUBMIND_RELEASE_KEY_PASSWORD: ${{ secrets.HUBMIND_RELEASE_KEY_PASSWORD }}
        run: |
          gradle testDebugUnitTest assembleDebug assembleRelease --no-daemon --stacktrace
          mkdir -p ../release
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../release/Hub-Mind-Android-v2.4.0.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk ../release/Hub-Mind-Android-v2.4.0.apk
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub-mind-android-apk
          path: release/Hub-Mind-Android-v2.4.0.apk
          if-no-files-found: error
          retention-days: 30
