name: Hub-Mind Android Test APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: hub-mind-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android-test-apk:
    name: Test and package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub runner Android SDK is not configured}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests and assemble debug APK
        working-directory: android
        run: gradle --no-daemon --max-workers=2 --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK identity, signature and SHA fingerprints
        id: apk
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.aistudio.hubmind.wzyqkp'"
          echo "$BADGING" | grep -F "versionCode='240'"
          echo "$BADGING" | grep -F "versionName='2.4.0'"
          CERT="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERT"
          SHA1="$(printf '%s\n' "$CERT" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1)"
          SHA256="$(printf '%s\n' "$CERT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$SHA1"
          test -n "$SHA256"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "## Hub-Mind Android test APK"
            echo ""
            echo "- Application ID: \`com.aistudio.hubmind.wzyqkp\`"
            echo "- Version: \`2.4.0 (240)\`"
            echo "- APK signer SHA-1: \`$SHA1\`"
            echo "- APK signer SHA-256: \`$SHA256\`"
            echo "- APK file SHA-256: \`$APK_SHA256\`"
            echo ""
            echo "This is a CI debug/test APK, not a production-signed release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare clearly labelled test artifact
        working-directory: android
        run: |
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk ../release/Hub-Mind-Android-TEST-v2.4.0-240-debug.apk
          sha256sum ../release/Hub-Mind-Android-TEST-v2.4.0-240-debug.apk > ../release/Hub-Mind-Android-TEST-v2.4.0-240-debug.apk.sha256

      - name: Upload installable Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: Hub-Mind-Android-TEST-v2.4.0-240-debug
          path: |
            release/Hub-Mind-Android-TEST-v2.4.0-240-debug.apk
            release/Hub-Mind-Android-TEST-v2.4.0-240-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
